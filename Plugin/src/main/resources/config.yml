import:
  # Folder name for imported worlds. {arena} is replaced with the
  # lowercased arena name. Import fails if the folder already exists.
  world-name-format: "{arena}"

export:
  # Only export dealer/hologram NPCs located inside the arena region.
  # Disable if your holograms sit slightly outside the region corners.
  only-holograms-inside-region: true

network:
  connect-timeout-ms: 10000
  read-timeout-ms: 30000
  index-cache-seconds: 300
